<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>PDF · ЕРМ Запад</title>
<link rel="icon" href="/icon-192.png">
<script src="/icons.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #475569; font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; border: 0; background: none; cursor: pointer; }
  svg.lucide { width: 22px; height: 22px; }
  .bar { position: sticky; top: 0; z-index: 10; background: #0f172a; color: #fff; display: flex; align-items: center; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) 12px 8px 4px; }
  .back { display: flex; align-items: center; gap: 2px; color: #fff; font-weight: 600; padding: 8px; }
  .title { flex: 1; min-width: 0; font-size: 14px; color: #cbd5e1; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pages { padding: 10px 0 calc(20px + env(safe-area-inset-bottom)); }
  .page { position: relative; margin: 0 auto 10px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .page canvas { display: block; width: 100%; height: auto; }
  .hit { position: absolute; background: rgba(250, 204, 21, .45); outline: 2px solid #eab308; border-radius: 3px; }
  .msg { color: #fff; text-align: center; padding: 40px 20px; }
</style>
</head>
<body>
<div class="bar">
  <button class="back" id="back"><span id="backIc"></span><span id="backTx"></span></button>
  <div class="title" id="title"></div>
</div>
<div class="pages" id="pages"><div class="msg" id="msg"></div></div>

<script type="module">
// Eigener PDF-Betrachter: In der iPhone-Home-Screen-App gäbe es beim direkten Öffnen eines PDFs keinen Weg zurück.
import * as pdfjs from "/vendor/pdfjs/pdf.min.mjs";
pdfjs.GlobalWorkerOptions.workerSrc = "/vendor/pdfjs/pdf.worker.min.mjs";

const P = new URLSearchParams(location.search);
const date = P.get("d") || "", q = (P.get("q") || "").toUpperCase();
const lang = (JSON.parse(localStorage.getItem("erm-outages") || "{}").lang) || "bg";
const L = lang === "en"
  ? { back: "Back", title: "Planned power cuts", loading: "Loading document…", fail: "The document is not available." }
  : { back: "Назад", title: "Планирани спирания", loading: "Документът се зарежда…", fail: "Документът не е наличен." };
document.documentElement.lang = lang;
document.getElementById("backIc").innerHTML = ICONS["chevron-left"];
document.getElementById("backTx").textContent = L.back;
document.getElementById("title").textContent = `${L.title} · ${date.split("-").reverse().join(".")}`;
document.getElementById("msg").textContent = L.loading;
document.getElementById("back").addEventListener("click", () => {
  if (history.length > 1 && document.referrer.startsWith(location.origin)) history.back(); else location.href = "/";
});

// PDF-Koordinaten → Bildschirm (Matrix des Viewports)
const toView = (vp, x, y) => { const [a, b, c, d, e, f] = vp.transform; return [a * x + c * y + e, b * x + d * y + f]; };
const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const re = q ? new RegExp(`(^|[\\s,(])${esc(q)}($|[\\s,)])`) : null;

try {
  if (!/^\d{4}-\d\d-\d\d$/.test(date)) throw new Error("date");
  const pdf = await pdfjs.getDocument({ url: `/api/pdf/${date}`, isEvalSupported: false }).promise;
  const box = document.getElementById("pages");
  box.innerHTML = "";
  const width = Math.min(box.clientWidth - 16, 900), dpr = Math.min(window.devicePixelRatio || 1, 3);
  let first = null;
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: width / base.width });
    const div = document.createElement("div");
    div.className = "page"; div.style.width = vp.width + "px"; div.style.height = vp.height + "px";
    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(vp.width * dpr); canvas.height = Math.floor(vp.height * dpr);
    div.appendChild(canvas); box.appendChild(div);
    await page.render({ canvas, canvasContext: canvas.getContext("2d"), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
    if (!re) continue;
    // Zeilen mit dem gesuchten Ort gelb markieren
    const { items } = await page.getTextContent();
    for (const it of items) {
      const up = (it.str || "").toUpperCase().trim();
      if (!up || /^(ОБЩИНА|ОБЛАСТ)\s/.test(up) || !re.test(up)) continue; // Überschriften von Gemeinde/Region nicht markieren
      const [a, b, c, d, x, y] = it.transform;
      const h = Math.hypot(c, d) || 10;
      const [x1, y1] = toView(vp, x, y - h * 0.25), [x2, y2] = toView(vp, x + it.width, y + h * 0.95);
      // ganze Tabellenzeile markieren, damit auch die Uhrzeiten hervorgehoben sind
      const hit = document.createElement("div");
      hit.className = "hit";
      Object.assign(hit.style, { left: Math.min(x1, x2) - 4 + "px", top: Math.min(y1, y2) - 2 + "px",
        width: vp.width - Math.min(x1, x2) - vp.width * 0.04 + "px", height: Math.abs(y2 - y1) + 4 + "px" });
      div.appendChild(hit);
      first ||= hit;
    }
    if (first && n === 1) first.scrollIntoView({ block: "center" });
  }
  if (first) first.scrollIntoView({ block: "center", behavior: "smooth" });
} catch (err) {
  console.warn(err);
  document.getElementById("pages").innerHTML = `<div class="msg">${L.fail}</div>`;
}
</script>
</body>
</html>
